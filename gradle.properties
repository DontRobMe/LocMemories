# Mémoire du démon Gradle : R8 et Robolectric sont gourmands.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Synchronisation parallèle d'Android Studio (Gradle 9.4+).
org.gradle.tooling.parallel=true

# Kotlin compilé dans le démon Gradle : une JVM de moins, et plus d'échec de connexion
# au démon Kotlin quand la RAM est saturée (émulateur + Android Studio ouverts).
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
